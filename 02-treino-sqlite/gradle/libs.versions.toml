# Version catalog: todas as versoes do projeto ficam neste arquivo, e os
# build.gradle.kts referenciam por alias (libs.*).
[versions]
agp = "9.3.1"
coreKtx = "1.19.0"
activity = "1.13.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# Traz o enableEdgeToEdge() usado na Activity.
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# Componentes e temas do Material Design 3 para o sistema de Views.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
